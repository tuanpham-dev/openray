# Publishes apps/website (landing page + Starlight docs) to GitHub Pages.
#
# Separate from build.yml on purpose: that workflow owns app installers and
# only runs its bundling job on a tag, while the site should redeploy on any
# push that touches it. Requires the repository's Pages source to be set to
# "GitHub Actions" (Settings → Pages → Build and deployment → Source).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Allow one concurrent deployment, and let a newer push supersede an
# in-flight one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter openray-website build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
