<!-- The menu-bar/tray glyph: the same bolt as icon.svg, but bare and
     solid black — a macOS *template* image, which the system recolours
     for a light or dark menu bar (and dims when the item is disabled).
     Only the alpha channel matters, so no tile, gradient, or shadow.
     Regenerate the PNGs with the command in the README's Development
     section. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- 48x46 glyph scaled to 26px tall and centred; the padding is what
       sets the glyph's size in the bar, since the whole image is scaled to
       the bar's fixed 18pt slot. -->
  <g transform="translate(4.43 5) scale(0.5652)">
    <path fill="#000000" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
  </g>
</svg>
